version: "3.8"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
    ports:
      - "27017:27017"   # optional, for local debugging

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: yourdockerhubusername/expense-server:latest
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://root:examplepassword@mongo:27017/expenseDB?authSource=admin
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: yourdockerhubusername/expense-client:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # If this React app is built with API URL at build time, ensure build arg or env injection
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "80:80"

volumes:
  mongo-data:
